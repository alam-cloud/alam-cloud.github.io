name: Sync Builder Center articles

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builder-article-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure pandoc
        run: |
          if ! command -v pandoc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y pandoc
          fi
          pandoc --version | head -1

      - name: Refresh static article cards and sections
        run: python3 scripts/update_builder_articles.py

      - name: Commit updated article cards
        run: |
          if git diff --quiet -- index.html; then
            echo "No Builder Center article changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Builder Center articles"
          git push
