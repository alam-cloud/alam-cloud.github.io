    <style>
        :root {
            --bg-primary: #05080f;
            --bg-secondary: #0a0f1c;
            --bg-card: #0d1321;
            --border: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent-success: #00d4aa;
            --accent-info: #38bdf8;
            --accent-warn: #ffd93d;
            --accent-alert: #ff6b6b;
            --glow-success: rgba(0, 212, 170, 0.3);
            --glow-info: rgba(56, 189, 248, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        ::selection { background: var(--accent-success); color: var(--bg-primary); }

        :focus-visible {
            outline: 2px solid var(--accent-info);
            outline-offset: 3px;
            border-radius: 2px;
        }

        /* Skip link */
        .skip-link {
            position: fixed;
            top: -100px;
            left: 1rem;
            z-index: 10001;
            background: var(--accent-success);
            color: var(--bg-primary);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 1rem; }

        /* Scroll progress */
        #scroll-progress {
            position: fixed;
            top: 0; left: 0;
            height: 2px;
            width: 0;
            background: linear-gradient(90deg, var(--accent-success), var(--accent-info));
            z-index: 1001;
            box-shadow: 0 0 8px var(--glow-success);
        }

        /* CRT scanlines — subtle texture */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
        }

        /* Deploy Splash — quick, professional entry (replaces old scrolling boot log) */
        #boot-sequence {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 40%, #0a1220 0%, var(--bg-primary) 65%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: 'JetBrains Mono', monospace;
            transition: opacity 0.5s ease-out, visibility 0.5s;
            cursor: pointer;
        }
        #boot-sequence.done { opacity: 0; visibility: hidden; pointer-events: none; }
        .boot-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: splashIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        }
        @keyframes splashIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
        .boot-logo {
            font-size: 2.6rem;
            color: var(--accent-info);
            text-shadow: 0 0 24px var(--glow-info);
            animation: pulse 1.6s infinite;
            line-height: 1;
        }
        .boot-name {
            margin-top: 0.9rem;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .boot-name span { color: var(--accent-success); }
        .boot-stages {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 1.4rem 0 1rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        .boot-stage {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-card);
            transition: all 0.25s;
            white-space: nowrap;
        }
        .boot-stage::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.25s;
        }
        .boot-stage.active { border-color: var(--accent-info); color: var(--accent-info); }
        .boot-stage.active::before { background: var(--accent-info); box-shadow: 0 0 8px var(--glow-info); animation: blink 0.8s infinite; }
        .boot-stage.passed { border-color: var(--accent-success); color: var(--accent-success); }
        .boot-stage.passed::before { background: var(--accent-success); box-shadow: 0 0 8px var(--glow-success); }
        .boot-bar {
            height: 4px;
            border-radius: 2px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .boot-bar-fill {
            height: 100%;
            width: 0;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--accent-success), var(--accent-info));
            box-shadow: 0 0 12px var(--glow-success);
            transition: width 0.3s ease;
        }
        .boot-status {
            margin-top: 0.7rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
            min-height: 1.1em;
        }
        .boot-status .ok { color: var(--accent-success); }
        .boot-hint {
            margin-top: 1.6rem;
            color: var(--text-secondary);
            font-size: 0.7rem;
            opacity: 0.6;
            animation: blink 2s infinite;
        }

        /* Particle Canvas */
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 1rem 0;
            transition: padding 0.3s;
        }
        header.scrolled { padding: 0.55rem 0; }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-success);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }
        .logo::before {
            content: '◈';
            color: var(--accent-info);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .nav-links {
            display: flex;
            gap: 1.6rem;
            list-style: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
            position: relative;
            white-space: nowrap;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-success); }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0;
            width: 0; height: 2px;
            background: var(--accent-success);
            transition: width 0.3s;
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        .nav-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--accent-success);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--accent-success);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }
        .status-dot {
            width: 8px; height: 8px;
            background: var(--accent-success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--glow-success);
            animation: blink 2s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 80px;
            position: relative;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }
        .hero-content h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-content h1.glitching { animation: glitchFlicker 0.3s steps(2) 2; }
        @keyframes glitchFlicker {
            0% { text-shadow: 2px 0 var(--accent-alert), -2px 0 var(--accent-info); }
            50% { text-shadow: -2px 0 var(--accent-alert), 2px 0 var(--accent-info); }
            100% { text-shadow: none; }
        }
        .hero-content .subtitle {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-info);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            min-height: 1.6em;
        }
        .hero-content .description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 500px;
            margin-bottom: 2rem;
        }
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover {
            border-color: var(--accent-success);
            box-shadow: 0 0 20px var(--glow-success);
            transform: translateY(-2px);
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-success);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }
        .cta-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.875rem 1.75rem;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: var(--accent-success);
            color: var(--bg-primary);
        }
        .btn-primary:hover {
            box-shadow: 0 0 30px var(--glow-success);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            color: var(--accent-info);
            border: 1px solid var(--accent-info);
        }
        .btn-secondary:hover {
            background: rgba(56, 189, 248, 0.1);
            box-shadow: 0 0 20px var(--glow-info);
        }

        /* Terminal Window */
        .terminal-window {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .terminal-header {
            background: var(--bg-secondary);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .terminal-btn { width: 12px; height: 12px; border-radius: 50%; }
        .terminal-btn.red { background: var(--accent-alert); }
        .terminal-btn.yellow { background: var(--accent-warn); }
        .terminal-btn.green { background: var(--accent-success); }
        .terminal-title {
            margin-left: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .terminal-body {
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.8;
            min-height: 300px;
        }
        .terminal-line {
            margin: 0.25rem 0;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .terminal-line.visible { opacity: 1; transform: none; }
        .terminal-prompt { color: var(--accent-success); }
        .terminal-command { color: var(--text-primary); }
        .terminal-output { color: var(--text-secondary); padding-left: 1.5rem; }
        .terminal-highlight { color: var(--accent-info); }
        .terminal-warn { color: var(--accent-warn); }
        .terminal-success { color: var(--accent-success); }
        .cursor {
            display: inline-block;
            width: 8px; height: 16px;
            background: var(--accent-success);
            animation: cursorBlink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Sections */
        section { padding: 6rem 0; position: relative; }
        section[id] { scroll-margin-top: 76px; }
        .section-alt { background: var(--bg-secondary); }
        .section-header { margin-bottom: 3rem; }
        .section-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-success);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .section-tag::before { content: '//'; color: var(--text-secondary); }
        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .section-desc {
            color: var(--text-secondary);
            max-width: 600px;
            font-size: 1.1rem;
        }

        /* Timeline */
        .timeline { position: relative; padding-left: 2rem; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-success), var(--accent-info), transparent);
        }
        .timeline-item {
            position: relative;
            margin-bottom: 2.5rem;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.6s;
        }
        .timeline-item.visible {
            opacity: 1;
            transform: translateX(0);
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2rem; top: 0.5rem;
            width: 12px; height: 12px;
            background: var(--bg-primary);
            border: 2px solid var(--accent-success);
            border-radius: 50%;
            transform: translateX(-5px);
            box-shadow: 0 0 10px var(--glow-success);
        }
        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .timeline-role {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .timeline-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-warn);
            background: rgba(255, 217, 61, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
        }
        .timeline-company {
            color: var(--accent-info);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }
        .timeline-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
        }
